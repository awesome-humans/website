# The awesome-humans.net site's base configuration. scripts/merge_nav.py writes a copy to
# build/zensical.toml with the navigation added, beside the staged pages, so build from
# there. For the steps, see README.md: Build the site.
#
# docs_dir and site_dir are relative to the staged copy. Each ecosystem lives under its own
# path, such as /dotnet/, which the ecosystem's staging command writes.

[project]
site_name = "Awesome Humans"
site_description = "An agentic take on curated awesome-* lists: distilled guidance, thanks to awesome humans."
site_url = "https://awesome-humans.net/"
# The header's repository link. javascripts/ecosystem.js points it at an ecosystem's own
# repository under /<id>/, from javascripts/repositories.js, which stage.py writes.
repo_url = "https://github.com/awesome-humans/website"
repo_name = "awesome-humans/website"
docs_dir = "docs"
site_dir = "public"
extra_css = ["stylesheets/awesome-humans.css"]
extra_javascript = ["javascripts/repositories.js", "javascripts/ecosystem.js", "javascripts/open-details.js"]

[project.theme]
# The look comes from the Awesome Humans design system, through
# stylesheets/awesome-humans.css. The modern variant keeps the header and tabs on the
# page background, so the brand green stays on links and each ecosystem's accent on its
# stripe, tick, active link, and chip.
variant = "modern"
# IBM Plex, self-hosted by awesome-humans.css. The default loads Roboto from Google
# Fonts, a third-party request on every page view.
font = false
logo = "assets/brand/mark-cited-human.svg"
favicon = "assets/brand/favicon.svg"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Light and dark mode, defaulting to the reader's system preference, with a toggle that
# cycles through system, light and dark. The colours are custom, set in
# stylesheets/awesome-humans.css.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Markdown extensions. Listing any replaces Zensical's defaults, so this restates them
# (zensical/config.py, DEFAULT_MARKDOWN_EXTENSIONS, as of 0.0.70) after the site's own
# awesome_humans_markdown, which nests list content under its marker, as Prettier
# writes it and GitHub renders it. Recheck the defaults when Renovate bumps zensical.
[project.markdown_extensions.awesome_humans_markdown]
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
