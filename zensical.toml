# The awesome-humans.net site's base configuration. scripts/merge_nav.py writes a copy to
# build/zensical.toml with the navigation added, beside the staged pages, so build from
# there. For the steps, see README.md: Build the site.
#
# docs_dir and site_dir are relative to the staged copy. Each ecosystem lives under its own
# path, such as /dotnet/, which the ecosystem's staging command writes.

[project]
site_name = "Awesome Humans"
site_description = "What good looks like in each ecosystem, distilled from people with a proven track record of writing about it."
site_url = "https://awesome-humans.net/"
repo_url = "https://github.com/awesome-humans/dotnet"
repo_name = "awesome-humans/dotnet"
docs_dir = "docs"
site_dir = "public"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/open-details.js"]

[project.theme]
# Classic draws the header and tabs in the primary colour; the modern variant keeps
# them neutral, which leaves the brand colour only on links.
variant = "classic"
# System fonts: the default loads Roboto from Google Fonts, a third-party request on
# every page view.
font = false
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Light and dark mode, defaulting to the reader's system preference, with a toggle that
# cycles through system, light and dark. The colours are custom, the .NET brand purple
# set in stylesheets/extra.css.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
