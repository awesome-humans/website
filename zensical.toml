# The awesome-humans.net site's base configuration. scripts/merge_nav.py writes a copy to
# build/zensical.toml with the navigation added, beside the staged pages, so build from
# there. For the steps, see README.md: Build the site.
#
# docs_dir and site_dir are relative to the staged copy. Each ecosystem lives under its own
# path, such as /dotnet/, which the ecosystem's staging command writes.

[project]
site_name = "Awesome Humans"
site_description = "An agentic take on curated awesome-* lists: distilled guidance, thanks to awesome humans."
site_url = "https://awesome-humans.net/"
repo_url = "https://github.com/awesome-humans/dotnet"
repo_name = "awesome-humans/dotnet"
docs_dir = "docs"
site_dir = "public"
extra_css = ["stylesheets/awesome-humans.css"]
extra_javascript = ["javascripts/ecosystem.js", "javascripts/open-details.js"]

[project.theme]
# The look comes from the Awesome Humans design system, through
# stylesheets/awesome-humans.css. The modern variant keeps the header and tabs on the
# page background, so the brand green stays on links and each ecosystem's accent on its
# stripe, tick, active link, and chip.
variant = "modern"
# IBM Plex, self-hosted by awesome-humans.css. The default loads Roboto from Google
# Fonts, a third-party request on every page view.
font = false
logo = "assets/brand/mark-cited-human.svg"
favicon = "assets/brand/favicon.svg"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Light and dark mode, defaulting to the reader's system preference, with a toggle that
# cycles through system, light and dark. The colours are custom, set in
# stylesheets/awesome-humans.css.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
