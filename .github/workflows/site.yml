name: Site

# Builds awesome-humans.net from this repository and every live ecosystem at main, and
# deploys it. Four triggers keep it current: a push to main here, an ecosystem-updated
# dispatch from an ecosystem's site-dispatch.yml when its main changes, a weekly schedule,
# and a manual run. Every build takes every ecosystem at main, so whichever repository
# triggers it, the result is the same. A pull request here builds and deploys a preview.
on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [ecosystem-updated]
  schedule:
    # Weekly, Mondays 06:00 UTC, so the site picks up anything a dispatch missed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, and a newer trigger replaces a queued one. Each pull
# request has its own group, so a preview never cancels a production deploy.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      preview-alias: ${{ github.event_name == 'pull_request' && format('pr-website-{0}', github.event.pull_request.number) || '' }}
    secrets: inherit
