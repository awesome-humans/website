name: Intake

# Routes the issues the Suggest a source and Opt out forms open. A suggestion is checked
# when it's opened or edited, and moves to its ecosystem's repository. An opt-out waits
# for the owner to label it verified, then opens an issue in each ecosystem that lists
# the source. For the rules, see scripts/route_issue.py.
on:
  issues:
    types: [opened, edited, labeled]

permissions: {}

jobs:
  route:
    # A form applies its labels as it opens the issue, which fires labeled once per
    # label. Only the verified label starts anything.
    if: >-
      github.event.issue.state == 'open' &&
      (
        (contains(github.event.issue.labels.*.name, 'suggest-source') && github.event.action != 'labeled') ||
        (contains(github.event.issue.labels.*.name, 'opt-out') && github.event.label.name == 'verified')
      )
    # One route per issue at a time, so an edit can't race the route of the issue it
    # edits. It's on the job, not the workflow, because the runs that the form's own
    # labels start are skipped here, and in a workflow-level group they could cancel
    # the waiting run of the opened issue.
    concurrency:
      group: intake-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Pinned to a release at least two weeks old when chosen, as in awesome-humans/dotnet.
      # The justfile is every entry point, so the steps below call its recipes, never npm
      # or uv.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0

      # The app moves issues to, and opens them in, the ecosystems' repositories, which
      # this workflow's own token can't reach. Add each ecosystem's repository here as it
      # goes live in ecosystems.toml. With issues write alone, transferIssue failed with
      # "Resource not accessible by integration" on 2026-10-17 (#57), so the token also
      # asks for contents write, which GitHub may count as write access to the repository.
      - name: Mint the app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: awesome-humans
          repositories: website,dotnet,rust
          permission-issues: write
          permission-contents: write

      - name: Route the issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          FORM: ${{ contains(github.event.issue.labels.*.name, 'opt-out') && 'opt-out' || 'suggest' }}
        run: just route-issue "$FORM" "$NUMBER"
