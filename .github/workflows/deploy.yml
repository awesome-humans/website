name: Deploy

# Deploys the site artifact that build.yml uploaded in the same run to Cloudflare, using
# wrangler.jsonc. Reusable: site.yml here calls it, and so does each ecosystem's
# site-preview.yml, with secrets: inherit for the organisation's Cloudflare secrets.
#
# With a preview alias, it uploads a preview version at its own URL without touching the
# live site. Without one, it deploys to awesome-humans.net.
#
# The deploy job declares a GitHub environment, preview or production, in the caller's
# repository. GitHub then shows a View deployment link on the pull request and lists each
# deploy on that repository's Deployments page.
on:
  workflow_call:
    inputs:
      preview-alias:
        description: The preview alias, such as pr-dotnet-12. Leave it empty to deploy to production.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A job's if can't read secrets, so this job decides for the deploy job. The secrets
  # are empty for a pull request from a fork, and the site builds there without deploying.
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deployable.outputs.deploy }}
    steps:
      - name: Decide whether to deploy
        id: deployable
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.preview-alias != '' && 'preview' || 'production' }}
      # A preview links its alias URL, which stays the same across the pull request's
      # pushes, and falls back to the version URL. Production is the custom domain,
      # which wrangler deploy doesn't report as a URL.
      url: ${{ steps.alias.outputs.url || (inputs.preview-alias == '' && 'https://awesome-humans.net/') || steps.wrangler.outputs.deployment-url }}
    steps:
      # For wrangler.jsonc, from the same commit build.yml built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: awesome-humans/website
          ref: ${{ github.repository == 'awesome-humans/website' && github.sha || 'main' }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build/public

      # wranglerVersion pins Wrangler itself, which the action would otherwise take as
      # whatever v4 is latest. Renovate doesn't track this input, so bump it by hand.
      - name: Deploy with Wrangler
        id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          command: ${{ inputs.preview-alias != '' && format('versions upload --preview-alias {0}', inputs.preview-alias) || 'deploy' }}

      # wrangler-action v4.1.3 has no output for the alias URL, only Wrangler's printed
      # "Version Preview Alias URL" line, which may carry terminal colour codes.
      - name: Read the preview alias URL
        id: alias
        if: inputs.preview-alias != ''
        env:
          OUTPUT: ${{ steps.wrangler.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/.*Version Preview Alias URL: *\(https:[^[:space:]]*\).*/\1/p' | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
