name: Build

# Builds awesome-humans.net and uploads it as the site artifact. Reusable: site.yml here
# calls it, and so does each ecosystem's site-preview.yml, which passes its own id and
# the pull request's head commit as ecosystem and ref. Every other live ecosystem in
# ecosystems.toml builds at main, so a preview shows one change against the live site.
# The named ecosystem builds even while it's soon, so its pull requests get the strict
# build before it goes live.
#
# For the steps, see README.md: Build the site. This workflow runs the same recipes.
on:
  workflow_call:
    inputs:
      ecosystem:
        description: An ecosystem id from ecosystems.toml, to build at ref instead of main.
        type: string
        default: ""
      ref:
        description: The branch or commit to build the ecosystem at.
        type: string
        default: ""

permissions:
  contents: read

# Set explicitly rather than inherited, as in the ecosystems' own workflows.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Read by the site scripts, as scripts/ecosystems.py: built() says.
  PREVIEW_ECOSYSTEM: ${{ inputs.ecosystem }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow runs in the caller's repository, so name this one. Called from
      # here, it builds the commit that triggered the run. Called from an ecosystem, it
      # builds website at main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: awesome-humans/website
          ref: ${{ github.repository == 'awesome-humans/website' && github.sha || 'main' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Pinned to a release at least two weeks old when chosen, as in awesome-humans/dotnet.
      # The justfile is every entry point, so the steps below call its recipes, never npm
      # or uv.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0

      - name: Fetch the ecosystems
        id: fetch
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          REF: ${{ inputs.ref }}
        run: just fetch "$ECOSYSTEM" "$REF"

      # One setup step per toolchain in ecosystems.toml, each run only when a live
      # ecosystem needs it. stage.py fails on a toolchain this file has no step for.
      # The ecosystem's own global.json decides the SDK.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: contains(format(' {0} ', steps.fetch.outputs.toolchains), ' dotnet ')
        with:
          global-json-file: ${{ steps.fetch.outputs.dotnet-global-json }}

      # The ecosystem's own rust-toolchain.toml decides the toolchain. The runner has
      # rustup, which installs that one.
      - name: Install the Rust toolchain
        if: contains(format(' {0} ', steps.fetch.outputs.toolchains), ' rust ')
        working-directory: build/repos/rust
        run: rustup toolchain install

      - name: Stage the ecosystems and the shared pages
        run: just stage

      - name: Merge the navigation
        run: just nav

      - name: Collate the sources
        run: just sources

      # --strict fails the build on a link or anchor that resolves to nothing, whichever
      # repository the page came from.
      - name: Build the site
        run: |
          just install-python
          just build-site

      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/public
          retention-days: 1
          if-no-files-found: error
