# The site's Python environment. The justfile runs the site generator and the scripts
# under scripts/. Each script declares its own dependencies inline (PEP 723), so
# `uv run scripts/<name>.py` also runs it directly.
[project]
name = "awesome-humans-website"
version = "0"
description = "The awesome-humans.net site"
requires-python = ">=3.14"
dependencies = [
  # Pinned, so a new release arrives as a reviewed Renovate pull request rather
  # than a change to how the site builds.
  "zensical==0.0.73",
]

# The package is the site's own Markdown extensions, in src/awesome_humans_markdown/,
# which zensical.toml loads by name. uv installs it into the environment.
[build-system]
# Pinned like zensical, so Renovate's pep621 manager bumps it in a reviewed pull request.
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "awesome_humans_markdown"

# Tools for working on the site, which `just install` installs and the build doesn't need.
# Pinned like zensical, so a new release arrives as a reviewed Renovate pull request.
[dependency-groups]
dev = [
  "actionlint-py==1.7.12.25",
  # merge_nav.py and collate_sources.py declare it inline. Here at the same pin, so
  # pyright can resolve their imports.
  "jsonschema==4.26.0",
  "ruff==0.17.2",
  "taplo==0.9.3",
  "zizmor==1.31.1",
]

# Ruff formats and lints the Python in scripts/ and src/. `just format` and
# `just lint` run it. Lines run to 120 characters, the width the code is
# written to, rather than Ruff's 88.
[tool.ruff]
line-length = 120

# pyright checks the types in scripts/ and src/, against the project's environment.
# The scripts import each other from scripts/, so it's on the import path too.
[tool.pyright]
include = ["scripts", "src"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
