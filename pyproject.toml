# The site's Python environment. Run the site generator with `uv run zensical`.
# A script under scripts/ declares its own dependencies inline (PEP 723) and runs
# with `uv run scripts/<name>.py`.
[project]
name = "awesome-humans-website"
version = "0"
description = "The awesome-humans.net site"
requires-python = ">=3.14"
dependencies = [
  # Pinned, so a new release arrives as a reviewed Renovate pull request rather
  # than a change to how the site builds.
  "zensical==0.0.71",
]

# The package is the site's own Markdown extensions, in src/awesome_humans_markdown/,
# which zensical.toml loads by name. uv installs it into the environment.
[build-system]
# Pinned like zensical, so Renovate's pep621 manager bumps it in a reviewed pull request.
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "awesome_humans_markdown"

# Tools for working on the site, which `uv sync` installs and the build doesn't need.
# Pinned like zensical, so a new release arrives as a reviewed Renovate pull request.
[dependency-groups]
dev = [
  "ruff==0.17.1",
]

# Ruff formats and lints the Python in scripts/ and src/. Run `uv run ruff format`
# and `uv run ruff check`. Lines run to 120 characters, the width the code is
# written to, rather than Ruff's 88.
[tool.ruff]
line-length = 120
